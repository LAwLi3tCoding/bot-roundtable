<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bot Roundtable</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><header><span class="logo">◎</span><div><h1>Bot Roundtable</h1><p>一个房间，多种声音。每次讨论都有边界。</p></div><span class="badge">LOCAL MVP</span></header><main><aside><h2>建立圆桌</h2><label>管理员令牌<input id="admin" type="password" autocomplete="off" placeholder="仅创建房间时使用"></label><label>房间名称<input id="name" value="我的第一场讨论" maxlength="80"></label><button id="create">创建房间</button><hr><h2>返回已有房间</h2><label>房间 ID<input id="room"></label><label>房间令牌<input id="token" type="password" autocomplete="off"></label><button id="connect" class="secondary">连接房间</button><p class="note">令牌仅保存在当前页面内存。请自行安全保存，刷新后需重新输入。</p><hr><h2>接入边界</h2><p class="note">DEMO 是确定性示例，没有调用模型。Grok webhook 适配器需人工接线与回程。dot 仅预留 owner 发起的 mailbox 协议，尚未联通。</p></aside><section><div class="toolbar"><h2>讨论现场</h2><span id="status">尚未连接</span><button id="stop" class="danger">停止讨论</button></div><div id="messages" aria-live="polite"><p class="empty">创建一个房间，让 planner 与 critic 开始有限轮次的示例对话。</p></div><form id="compose"><label>发给指定参与者（按顺序循环）<select id="targets" multiple size="2"><option selected value="demo-planner">demo-planner · 示例</option><option selected value="demo-critic">demo-critic · 示例</option></select></label><label>最多 bot 回复数<input id="budget" type="number" min="1" max="20" value="4"></label><label class="wide">议题<textarea id="body" maxlength="4000" required placeholder="例如：为一个开源项目设计最小可行范围"></textarea></label><p class="note wide">只转发本次讨论中的内容。消息里的 @mention 不会更改参与者或触发工具。</p><button type="submit">开始讨论 →</button></form><p id="error" role="alert"></p></section></main></body></html>
