# Template only. Operator supplies their own runtime key and tunnel ID.
config_version: 1
control_plane:
  tunnel_id: <TUNNEL_ID>
  api_key: env:CONTROL_PLANE_API_KEY
mcp:
  server_urls:
    - channel: main
      url: http://127.0.0.1:8766/mcp
  extra_headers:
    Authorization: env:ROUNDTABLE_TUNNEL_AUTH_HEADER
